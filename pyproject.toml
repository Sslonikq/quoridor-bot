[project]
name = "quoridor-bot"
version = "0.1.0"
description = "Quoridor bot (offline)"
requires-python = ">=3.11"

[project.optional-dependencies]
dev = ["pytest", "ruff", "hypothesis"]
# optional speed-up (phase 9): compiled kernels, quoridor/jit.py; QUORIDOR_NO_NUMBA=1 turns it off
fast = ["numba"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["slow: long tests (hypothesis, full games); skip with -m \"not slow\""]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["test.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
