<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Анализатор Коридора</title>
<link rel="stylesheet" href="/app.css">
</head>
<body>
<div class="wrap">
  <header>
    <h1>Анализатор Коридора</h1>
    <span class="tag">Подсказки бота v4, офлайн. Ходы за обе стороны вводите сами.</span>
  </header>

  <div class="main">
    <section class="left">
      <div class="toolbar">
        <button class="icon" id="bFirst" title="К началу (Home)">«</button>
        <button class="icon" id="bPrev" title="Назад (←)">‹</button>
        <button class="icon" id="bNext" title="Вперёд (→)">›</button>
        <button class="icon" id="bLast" title="К концу (End)">»</button>
        <span class="sep"></span>
        <button id="bUndo" title="Отменить ход (Backspace)">↶<span class="lbl"> Отменить</span><kbd>⌫</kbd></button>
        <button id="bFlip" title="Перевернуть доску (F)">⇅<span class="lbl"> Перевернуть</span><kbd>F</kbd></button>
        <button id="bHint" class="on" title="Подсказка (H)">💡<span class="lbl" id="hintLbl"> Подсказка: вкл</span><kbd>H</kbd></button>
        <button id="bDeep" title="Глубокий анализ текущей позиции, 20 с (Esc отменяет)">🔍<span class="lbl" id="deepLbl"> Глубокий анализ</span><kbd>20 с</kbd></button>
      </div>
      <div class="boardrow">
        <div class="evalbar" id="evalbar" aria-label="Шкала оценки"><div class="w" id="evalW"></div><div class="num" id="evalNum"></div></div>
        <div class="boardbox"><svg id="board" viewBox="0 0 600 600" role="img" aria-label="Доска 9 на 9"></svg></div>
      </div>
      <div class="card graph-card">
        <h2>График партии</h2>
        <svg class="graph" id="graph" viewBox="0 0 600 120" role="img" aria-label="Оценка по ходам"></svg>
      </div>
      <div class="legend">
        <span>Клик по клетке: ход фишкой.</span>
        <span>Наведите на щель между клетками: появится стенка, клик ставит её.</span>
        <span>Ход за обе стороны.</span>
      </div>
    </section>

    <aside class="side">
      <div class="card">
        <div class="status" id="status"></div>
        <div class="turn" id="turn"></div>
      </div>
      <div class="card">
        <h2>Лучшие ходы</h2>
        <div class="best" id="best"></div>
        <progress id="deepProg" value="0" max="1" hidden></progress>
        <div class="msg" id="anaMsg"></div>
      </div>
      <div class="card">
        <h2>Партия</h2>
        <div class="moves" id="moves"></div>
        <div class="mvinfo" id="mvInfo"></div>
        <div class="summary" id="summary"></div>
        <div class="toolbar"><button id="bRestore" hidden>Вернуть партию</button><button id="bCopy">Копировать ходы</button><button id="bNew">Новая доска</button></div>
      </div>
      <div class="card load-card">
        <h2>Загрузить и разобрать партию</h2>
        <textarea id="pgn" spellcheck="false" placeholder="Вставьте ходы с сайта: d1 e8 c1 e7 …"></textarea>
        <div class="toolbar">
          <button id="bLoad">Загрузить и разобрать</button>
          <button id="bReview" title="Разобрать текущий список ходов">Разобрать партию</button>
          <label class="rt">Бюджет, с/позицию <input type="number" id="revTime" min="0.1" max="10" step="0.1" value="1"></label>
        </div>
        <progress id="revProg" value="0" max="1" hidden></progress>
        <div class="msg" id="loadMsg"></div>
      </div>
    </aside>
  </div>
</div>
<div class="toast" id="toast" role="status"></div>
<script src="/app.js"></script>
</body>
</html>
